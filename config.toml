model = "gpt-5.4"
model_reasoning_effort = "high"

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp", "--api-key", "${CONTEXT_APIKEY}"]

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/home/har/repo", "/home/har/.codex/skills"]

[mcp_servers.git]
command = "npx"
args = ["-y", "@mseep/git-mcp-server"]

[mcp_servers.mysql]
command = "npx"
args = ["-y", "mcp-server-mysql"]

[mcp_servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]

[mcp_servers.playwright]
args = ["@playwright/mcp@latest"]
command = "npx"

[projects."/home/har/repo"]
trust_level = "trusted"

[projects."/home/har/repo/ek-auto-tool"]
trust_level = "trusted"

[projects."/home/har"]
trust_level = "trusted"

[features]
multi_agent = true

